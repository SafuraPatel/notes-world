<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notes World</title>
  <meta name="description"
    content="Notes World: Ultra-simple, mobile-first study portal for UGC NET and MH-SET. Essential Units, Theory bullet points, Short Tricks, and personal Notepad for Paper 1 and Paper 2 Computer Science.">
  <link rel="stylesheet" href="css/theme.css?v=2.6">
  <link rel="stylesheet" href="css/layout.css?v=2.6">
  <link rel="stylesheet" href="css/components.css?v=2.6">
</head>

<body class="paper-1-theme">
  <div class="app-wrapper">
    <header class="app-header">
      <!-- Row 1: P 1/2 indicator, (Section) badge, Brand title, Sync button (Flaticon 1069890), Theme toggle -->
      <div class="header-row-top">
        <div class="header-top-left">
          <button id="headerPaperBadge" class="brand-p-badge" type="button" title="Click to toggle Paper 1 / Paper 2">P 1</button>
          <span id="headerSectionBadge" class="brand-section-badge">(Units)</span>
          <span class="brand-title-text">Notes World</span>
        </div>
        <div class="header-top-right">
          <button id="cloudSyncBtn" class="cloud-sync-btn" type="button" aria-label="Sync Cloud Data"
            title="Sync across devices">
            <svg class="cloud-sync-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 17.5H7a4.5 4.5 0 0 1-.8-8.93A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 2 9Z" />
              <path d="M9.8 12.8a2.5 2.5 0 0 1 4.4-1.2l.8-.8" />
              <polyline points="15 10.8 15 13 12.8 13" />
              <path d="M14.2 14.8a2.5 2.5 0 0 1-4.4 1.2l-.8.8" />
              <polyline points="9 16.8 9 14.6 11.2 14.6" />
            </svg>
            <span id="syncStatusText" class="sync-status-text">Sync</span>
          </button>
          <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle Dark or Light Mode"
            title="Toggle Theme">
            <span id="themeIcon">🌙</span>
          </button>
        </div>
      </div>

      <!-- Row 2: Units , Theory , Tricks, Questions , Notepad -->
      <nav class="nav-tabs-bar" aria-label="Section Navigation" role="tablist">
        <button class="tab-btn active" data-section="units" type="button" role="tab">
          <span class="tab-icon">📚</span>
          <span>Units</span>
        </button>
        <button class="tab-btn" data-section="theory" type="button" role="tab">
          <span class="tab-icon">📖</span>
          <span>Theory</span>
        </button>
        <button class="tab-btn" data-section="tricks" type="button" role="tab">
          <span class="tab-icon">💡</span>
          <span>Tricks</span>
        </button>
        <button class="tab-btn" data-section="questions" type="button" role="tab">
          <span class="tab-icon">🎯</span>
          <span>Questions <span id="tabQuestionsCountBadge">(0)</span></span>
        </button>
        <button class="tab-btn" data-section="notepad" type="button" role="tab">
          <span class="tab-icon">📝</span>
          <span>Notepad</span>
        </button>
      </nav>

      <!-- Row 3: Paper 1 , paper 2 -->
      <nav class="paper-switcher" aria-label="Paper Selection">
        <button id="btnPaper1" class="paper-tab-btn active" type="button">
          Paper 1
        </button>
        <button id="btnPaper2" class="paper-tab-btn" type="button">
          Paper 2
        </button>
      </nav>

      <!-- Row 4: units Search -->
      <div id="filterBar" class="filter-bar">
        <div class="filter-row">
          <select id="unitSelectDropdown" class="unit-select-box" aria-label="Filter by Unit">
            <!-- Dynamically populated -->
          </select>
          <div class="search-box-wrap">
            <span class="search-icon">🔍</span>
            <input type="search" id="globalSearchInput" placeholder="Search..." autocomplete="off">
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-content">
      <!-- 1. UNITS SECTION -->
      <section id="unitsSection" class="content-section">
        <div class="section-header">
          <h2 class="section-title">
            <span>📚</span>
            <span id="unitsSectionTitle">Paper 1 Units</span>
          </h2>
          <span class="section-badge">10 Units</span>
        </div>
        <div id="unitsListContainer" class="units-list">
          <!-- Dynamically populated via JS -->
        </div>
      </section>

      <!-- 2. THEORY SECTION (Pure Bullet & Point Notes) -->
      <section id="theorySection" class="content-section" style="display: none;">
        <div class="section-header">
          <div style="display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
            <button class="btn-back-to-home" type="button" title="Back to Units (Home)">
              ← Units
            </button>
            <h2 class="section-title">
              <span>📖</span>
              <span>Theory</span>
            </h2>
            <span id="theoryCountBadge" class="section-badge">0 Topics</span>
          </div>
          <button id="btnHeaderAddTheory" class="btn-header-add" type="button" title="Add Theory Topic">
            <span class="btn-add-icon">+</span> Add
          </button>
        </div>

        <div id="theoryCardsContainer" class="theory-cards-grid">
          <!-- Dynamically populated via JS -->
        </div>
      </section>

      <!-- 3. TRICKS SECTION (Short Tricks & Mnemonics) -->
      <section id="tricksSection" class="content-section" style="display: none;">
        <div class="section-header">
          <div style="display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
            <button class="btn-back-to-home" type="button" title="Back to Units (Home)">
              ← Units
            </button>
            <h2 class="section-title">
              <span>💡</span>
              <span>Short Tricks &amp; Mnemonics</span>
            </h2>
            <span id="tricksCountBadge" class="section-badge">0 Tricks</span>
          </div>
          <button id="btnHeaderAddTrick" class="btn-header-add" type="button" title="Add Short Trick">
            <span class="btn-add-icon">+</span> Add
          </button>
        </div>

        <div id="tricksContainer" class="tricks-grid">
          <!-- Dynamically populated via JS -->
        </div>
      </section>

      <!-- 4. QUESTIONS (PYQ) SECTION -->
      <section id="questionsSection" class="content-section" style="display: none;">
        <div class="section-header">
          <div style="display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
            <button class="btn-back-to-home" type="button" title="Back to Units (Home)">
              ← Units
            </button>
            <h2 class="section-title">
              <span>🎯</span>
              <span id="questionsSectionTitle">Unit-wise PYQs (Paper 1)</span>
            </h2>
          </div>
          <span id="questionsCountBadge" class="section-badge">0 Questions</span>
        </div>

        <!-- Score & Progress Stats Bar -->
        <div id="pyqStatsBar" class="pyq-stats-bar">
          <div class="pyq-stats-group">
            <span class="pyq-stat-pill" id="pyqAttemptedPill">📝 Attempted: 0/0</span>
            <span class="pyq-stat-pill correct" id="pyqScorePill">✓ Score: 0</span>
            <span class="pyq-stat-pill accuracy" id="pyqAccuracyPill">🎯 Accuracy: 0%</span>
          </div>
          <button id="btnResetAllPyqs" class="btn-reset-pyqs" type="button"
            title="Reset all answered questions in this paper">
            ↺ Reset Answers
          </button>
        </div>

        <!-- Questions Cards Container -->
        <div id="questionsCardsContainer" class="questions-list">
          <!-- Dynamically populated via JS -->
        </div>
      </section>

      <!-- 5. NOTEPAD SECTION (My Points - Newest Always on Top) -->
      <section id="notepadSection" class="content-section" style="display: none;">
        <div class="section-header">
          <div style="display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
            <button class="btn-back-to-home" type="button" title="Back to Units (Home)">
              ← Units
            </button>
            <h2 class="section-title">
              <span>📝</span>
              <span id="notepadSectionTitle">My Points (Paper 1)</span>
            </h2>
          </div>
          <span id="notesCountBadge" class="section-badge">0 Points</span>
        </div>

        <div class="notepad-view">
          <!-- Note Form -->
          <form id="createNoteForm" class="notepad-form-card">
            <div class="form-row">
              <input type="text" class="point-title-input" placeholder="Title (e.g., Bloom taxonomy)" required>
              <select id="noteUnitSelect" class="point-unit-select">
                <!-- Dynamically populated -->
              </select>
            </div>

            <textarea class="point-textarea" placeholder="Write your notes here" required></textarea>

            <div class="form-bottom-row">
              <div class="color-dots-group" title="Card Color">
                <span class="color-dot active" data-color="#8b5cf6" style="background: #8b5cf6;"></span>
                <span class="color-dot" data-color="#10b981" style="background: #10b981;"></span>
                <span class="color-dot" data-color="#06b6d4" style="background: #06b6d4;"></span>
                <span class="color-dot" data-color="#f59e0b" style="background: #f59e0b;"></span>
                <span class="color-dot" data-color="#ef4444" style="background: #ef4444;"></span>
              </div>
              <button type="submit" class="btn-save-point">
                💾 Save
              </button>
            </div>
          </form>

          <!-- Saved Points Cards (Latest on Top) -->
          <div id="userNotesGrid" class="saved-points-list">
            <!-- Dynamically populated via JS -->
          </div>
        </div>
      </section>
    </main>

    <!-- Modal Backdrop Overlay -->
    <div id="modalOverlay" class="modal-overlay" style="display: none;"></div>

    <!-- 1. Theory Editor / Adder Modal -->
    <div id="theoryModal" class="app-modal" style="display: none;" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="theoryModalTitle" class="modal-title">Add Theory Topic</h3>
        <button id="btnCloseTheoryModal" class="modal-close-btn" type="button" aria-label="Close">✕</button>
      </div>
      <form id="theoryModalForm" class="modal-form">
        <input type="hidden" id="theoryModalTopicId" value="">
        <div class="modal-field">
          <label for="theoryModalUnitSelect">Select Unit:</label>
          <select id="theoryModalUnitSelect" class="modal-input" required>
            <!-- Populated via JS -->
          </select>
        </div>
        <div class="modal-field">
          <label for="theoryModalTopicTitle">Topic Title:</label>
          <input type="text" id="theoryModalTopicTitle" class="modal-input"
            placeholder="e.g. Asymptotic Notations &amp; Recurrences" required>
        </div>
        <div class="modal-field">
          <label for="theoryModalPoints">Theory:</label>
          <textarea id="theoryModalPoints" class="modal-textarea" rows="6"
            placeholder="- Point 1&#10;- Point 2&#10;- Point 3" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" id="btnCancelTheoryModal" class="btn-modal-cancel">Cancel</button>
          <button type="submit" class="btn-modal-save">💾 Save</button>
        </div>
      </form>
    </div>

    <!-- 2. Trick Editor / Adder Modal -->
    <div id="trickModal" class="app-modal" style="display: none;" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="trickModalTitle" class="modal-title">Add Short Trick</h3>
        <button id="btnCloseTrickModal" class="modal-close-btn" type="button" aria-label="Close">✕</button>
      </div>
      <form id="trickModalForm" class="modal-form">
        <input type="hidden" id="trickModalTrickId" value="">
        <div class="modal-field">
          <label for="trickModalUnitSelect">Select Unit:</label>
          <select id="trickModalUnitSelect" class="modal-input" required>
            <!-- Populated via JS -->
          </select>
        </div>
        <div class="modal-field">
          <label for="trickModalTitleInput">Trick Title:</label>
          <input type="text" id="trickModalTitleInput" class="modal-input" placeholder="e.g. memory hierarchy" required>
        </div>
        <div class="modal-field">
          <label for="trickModalMnemonic">Mnemonic / Shortcut Rule:</label>
          <textarea id="trickModalMnemonic" class="modal-textarea" rows="2" placeholder="Ramu caca please samosa"
            required></textarea>
        </div>
        <div class="modal-field">
          <label for="trickModalExplanation">Explanation:</label>
          <textarea id="trickModalExplanation" class="modal-textarea" rows="3"
            placeholder="Brief explanation of how this shortcut works..." required></textarea>
        </div>
        <div class="modal-field">
          <label for="trickModalProTip">Exam Pro-Tip (Optional):</label>
          <input type="text" id="trickModalProTip" class="modal-input" placeholder="e.g. imp area">
        </div>
        <div class="modal-actions">
          <button type="button" id="btnCancelTrickModal" class="btn-modal-cancel">Cancel</button>
          <button type="submit" class="btn-modal-save">💾 Save</button>
        </div>
      </form>
    </div>

    <!-- 3. Note Editor Modal -->
    <div id="noteModal" class="app-modal" style="display: none;" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="noteModalTitle" class="modal-title">✏️ Edit Study Point</h3>
        <button id="btnCloseNoteModal" class="modal-close-btn" type="button" aria-label="Close">✕</button>
      </div>
      <form id="noteModalForm" class="modal-form">
        <input type="hidden" id="noteModalNoteId" value="">
        <div class="modal-field">
          <label for="noteModalUnitSelect">Select Unit:</label>
          <select id="noteModalUnitSelect" class="modal-input" required>
            <!-- Populated via JS -->
          </select>
        </div>
        <div class="modal-field">
          <label for="noteModalTitleInput">Point Title:</label>
          <input type="text" id="noteModalTitleInput" class="modal-input" placeholder="e.g. Bloom taxonomy" required>
        </div>
        <div class="modal-field">
          <label for="noteModalContentTextarea">Point Notes:</label>
          <textarea id="noteModalContentTextarea" class="modal-textarea" rows="6" placeholder="Write your notes here..."
            required></textarea>
        </div>
        <div class="modal-field">
          <label>Card Accent Color:</label>
          <div id="noteModalColorDots" class="color-dots-group" style="padding-top: 0.2rem;">
            <span class="color-dot active" data-color="#8b5cf6" style="background: #8b5cf6;"></span>
            <span class="color-dot" data-color="#10b981" style="background: #10b981;"></span>
            <span class="color-dot" data-color="#06b6d4" style="background: #06b6d4;"></span>
            <span class="color-dot" data-color="#f59e0b" style="background: #f59e0b;"></span>
            <span class="color-dot" data-color="#ef4444" style="background: #ef4444;"></span>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="btnCancelNoteModal" class="btn-modal-cancel">Cancel</button>
          <button type="submit" class="btn-modal-save">💾 Save Changes</button>
        </div>
      </form>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  </div>

  <script type="module" src="js/app.js?v=2.6"></script>
</body>

</html>
